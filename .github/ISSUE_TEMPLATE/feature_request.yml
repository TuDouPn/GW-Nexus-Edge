name: Feature request
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述业务问题或用户痛点。
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选方案与取舍；涉及架构/安全/契约的变化需先走 ADR。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 可验证的完成标准。

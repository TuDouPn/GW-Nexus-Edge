# Repository Security：Secret Scan / SCA / SBOM / License 合规。
# Required Check 名称（分支保护使用，Job 名即 context）：Scan
# Fork 安全模型（DEV-0005 设计修订 1）：
#   - pull_request（含 Fork）：真实扫描、不读 Secret、permissions 仅 contents: read、
#     生成脱敏 Artifact、不授予 security-events: write、不上传 SARIF、扫描问题即失败。
#   - push main（可信）：独立 upload-sarif Job 单独授予 security-events: write 并上传 SARIF。
#   不使用 pull_request_target 执行 PR 代码；不用 event 表达式动态扩大整个 Workflow 权限。
name: Repository Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout with full history（Secret Scan 需 Git 历史）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks) —— 工作树 + Git 历史；确认 Secret 阻断
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 输出脱敏报告（不含 Secret Value）；发现 Secret 时该 Action 默认失败（阻断）
          report-format: json
          output: /tmp/gitleaks-report.json

      - name: Upload Gitleaks report (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: warn

      - name: SCA / filesystem-dependency scan (Trivy) —— HIGH/CRITICAL 阻断
        # 注：当前无生产 OCI Image，本扫描为 filesystem/dependency scan，
        # 不得描述为 Container Image Scan（DEV-0005 设计修订 5，NOT_APPLICABLE_YET）。
        # trivy 数据库无法获取 → 该步骤失败（TOOL_BLOCKED/INFRASTRUCTURE_FAILURE），不显示为无漏洞。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: /tmp/trivy-fs.sarif

      - name: Upload Trivy SARIF (artifact, 脱敏；Fork PR 不上传 Code Scanning)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-fs-sarif
          path: /tmp/trivy-fs.sarif
          if-no-files-found: warn

      - name: Generate CycloneDX SBOM (Maven plugin 2.9.3，已核验)
        working-directory: backend
        run: ./mvnw -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DoutputName=aggregate-bom

      - name: Validate SBOM（存在、可解析、含实际组件；禁止只检查退出码）
        shell: bash
        run: |
          BOM="backend/target/aggregate-bom.json"
          if [ ! -f "$BOM" ]; then echo "::error::SBOM 文件不存在"; exit 1; fi
          COUNT=$(jq -r '.components | length' "$BOM")
          echo "SBOM 组件数: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -eq 0 ] 2>/dev/null; then
            echo "::error::SBOM 未包含实际组件"; exit 1
          fi

      - name: Upload SBOM (artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: backend/target/aggregate-bom.json
          if-no-files-found: error

      - name: License compliance check（SBOM 取证；未识别/缺失/多表达式 → 人工复核清单，新增缺失阻断）
        shell: bash
        run: |
          # baseline 为版本化核验记录（docs/dev-0005/license-baseline.json）：
          #   verified[g:a]=license  —— 已从权威 POM/SBOM 核验（G-07 复核记录）
          #   review_required[g:a]   —— 已知待 G-07 逐项人工核验（人工复核清单，CI 不阻断但输出清单）
          python3 - <<'PYEOF'
          import json
          bom = json.load(open("backend/target/aggregate-bom.json"))
          baseline = json.load(open("docs/dev-0005/license-baseline.json"))
          review = []
          for c in bom.get("components", []):
              g, n = c.get("group",""), c.get("name","")
              lics = [l.get("license",{}).get("name","").strip() for l in c.get("licenses",[])] if c.get("licenses") else []
              if any(lics):
                  continue
              key = f"{g}:{n}" if g else n
              if key in baseline.get("verified", {}):
                  continue  # 已核验
              if key in baseline.get("review_required", []):
                  review.append(key)  # 已知待核验 → 人工复核清单
              else:
                  print(f"新增未核验 License 缺失（阻断）: {key}")
                  exit(1)
          print("License 缺失项（人工复核清单，G-07 待核验）:", len(review))
          json.dump({"review_required": review}, open("/tmp/license-review.json","w"))
          PYEOF

      - name: Upload License review list (artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-review
          path: /tmp/license-review.json
          if-no-files-found: warn

  # 高权限（security-events: write）限制在独立 Job + 明确事件条件（仅 push main 可信事件）。
  # 不使用 pull_request_target；Fork PR 不运行本 Job。
  upload-sarif:
    name: Upload SARIF (main only)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    needs: scan
    steps:
      - name: Download Trivy SARIF
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: trivy-fs-sarif
          path: /tmp/sarif
      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          sarif_file: /tmp/sarif/trivy-fs.sarif

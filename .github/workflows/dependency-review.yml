# Dependency Review：仅 pull_request。不获取写权限。
# Required Check context：Dependency Review / Review
# 本 Job 在依赖图尚未由 main 上的 dependency-submission 填充前会失败（bootstrap）。
# 不得在其于 PR 上真实成功前设为 Required Check。
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Dependency Review / Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

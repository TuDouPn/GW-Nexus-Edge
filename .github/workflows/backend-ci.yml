# Backend CI：Java 21 + Maven Wrapper + Testcontainers 真实集成验证。
# Required Check context（分支保护使用 Job Display Name）：Backend CI / Verify
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 公开仓库 Fork 安全模型：默认最小权限，不读任何 Secret。
permissions:
  contents: read

jobs:
  verify:
    name: Backend CI / Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      JAVA_VERSION: "21"
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml', 'backend/**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run clean verify (Testcontainers 需 Docker；ubuntu-latest 自带)
        working-directory: backend
        run: ./mvnw clean verify

      - name: diff --check（PR：merge-base→head SHA；push：提交范围）
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/ci/diff-check.sh "${{ github.event_name }}"

      - name: Check worktree has no uncommitted changes after tools
        run: bash scripts/ci/check-uncommitted.sh

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: warn

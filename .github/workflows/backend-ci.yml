# Backend CI：Java 21 + Maven Wrapper + Testcontainers 真实集成验证。
# Required Check 名称（分支保护使用，Job 名即 context）：Verify
# 固定 Action SHA 策略：全部 Action 固定到不可变 commit SHA，注释保留版本名称（DEV-0005 设计修订 4）。
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 公开仓库 Fork 安全模型（DEV-0005 设计修订 1/3）：默认最小权限，不读任何 Secret。
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JAVA_VERSION: "21"
    steps:
      - name: Checkout with full history（diff --check 需 base/head 历史）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml', 'backend/**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run clean verify (Testcontainers 需 Docker；ubuntu-latest 自带)
        working-directory: backend
        run: ./mvnw clean verify

      - name: diff --check（PR：merge-base→HEAD；push：与上一提交对比）
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$(git merge-base origin/${{ github.base_ref }} HEAD)"
            echo "diff --check base=$base head=$GITHUB_SHA"
            git diff --check "$base..$GITHUB_SHA"
          else
            git diff --check "$GITHUB_SHA^..$GITHUB_SHA"
          fi

      - name: Check worktree has no uncommitted changes after tools
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作树存在未提交变更（工具运行后不应产生）"
            git status --porcelain
            exit 1
          fi

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/**
          if-no-files-found: warn
